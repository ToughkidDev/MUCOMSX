<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUCPlayground Manual</title>
<meta name="description" content="MUCPlayground user's guide: playing, editing, the tracker, scope and keys, files, playlists, banks, share links, and the full MML reference.">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b16; --muted:#5d584c;
  --line:#ddd6c6; --accent:#b4451f; --accent2:#1f5f7a; --code-bg:#fffdf8; --soft:#efeadf;
  --note-bg:rgba(31,95,122,.08); --warn-bg:rgba(196,140,20,.14); --mark:rgba(242,184,0,.35);
  --t-cmd:#1f5f7a; --t-num:#9a5b00; --t-str:#8a3b8f; --t-com:#8a8270;
  --t-tag:#b4451f; --t-val:#2e7d4f; --t-mac:#6d4fc2;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans KR","Noto Sans JP",sans-serif;
  --side:290px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15140f; --panel:#1e1c16; --ink:#eae5d8; --muted:#a29b89;
    --line:#332f25; --accent:#e8794c; --accent2:#7fbcd8; --code-bg:#1a1813; --soft:#211f19;
    --note-bg:rgba(127,188,216,.10); --warn-bg:rgba(220,170,60,.16); --mark:rgba(255,210,63,.30);
    --t-cmd:#7fbcd8; --t-num:#e3a95a; --t-str:#d58fd0; --t-com:#8b8574;
    --t-tag:#e8794c; --t-val:#8fcf9f; --t-mac:#b59cf2;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
a{color:var(--accent2)}
code,kbd,pre{font-family:var(--mono)}
code{font-size:.9em;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 .3em;overflow-wrap:anywhere}
kbd{font-size:.82em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--panel);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.15rem;white-space:nowrap}
.top h1 small{font-weight:400;color:var(--muted);margin-left:.4em}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.search{flex:0 1 260px;min-width:140px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.menu-btn{display:none}

/* layout */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);max-width:1400px;margin:0 auto}
nav.toc{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:16px 10px 40px 18px;border-right:1px solid var(--line);font-size:.92rem}
nav.toc .part{margin:16px 0 4px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.toc a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink);text-decoration:none;line-height:1.35}
nav.toc a.sub{padding-left:20px;font-size:.86rem;color:var(--muted)}
nav.toc a:hover{background:var(--soft)}
nav.toc a.on{background:var(--note-bg);color:var(--accent2);font-weight:600}
main{padding:24px 40px 80px;min-width:0}
.doc{max-width:900px}
.hits{margin:0 0 16px;color:var(--muted);font-size:.9rem}

/* text */
h2{font-size:1.65rem;margin:56px 0 12px;padding-top:8px;border-top:2px solid var(--line)}
section.chapter:first-child h2{margin-top:8px;border-top:0}
h3{font-size:1.2rem;margin:32px 0 8px}
h4{font-size:1.02rem;margin:22px 0 6px}
.part-title{font-size:2rem;margin:72px 0 4px;color:var(--accent)}
.part-lead{color:var(--muted);margin:0 0 8px}
p,li{overflow-wrap:break-word}
ul,ol{padding-left:1.4em}
table{border-collapse:collapse;width:100%;margin:12px 0 18px;font-size:.93rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.note,.tip,.warn{border-left:4px solid var(--accent2);background:var(--note-bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.warn{border-left-color:#c48c14;background:var(--warn-bg)}
.tip{border-left-color:var(--accent)}
.lead{font-size:1.08rem}
figure.shot{margin:16px 0}

/* MML examples */
.ex{margin:14px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);overflow:hidden}
.ex pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:.88rem;line-height:1.55;white-space:pre}
.ex .bar{display:flex;justify-content:flex-end;gap:8px;padding:6px 8px;border-top:1px solid var(--line);background:var(--soft)}
.ex .bar .btn{font-size:.8rem;padding:3px 10px}
.t-cmd{color:var(--t-cmd)} .t-num{color:var(--t-num)} .t-str{color:var(--t-str)}
.t-com{color:var(--t-com);font-style:italic} .t-tag{color:var(--t-tag);font-weight:700}
.t-val{color:var(--t-val)} .t-mac{color:var(--t-mac)} .t-part{font-weight:700}

/* reference entries */
.book-lead{color:var(--muted)}
.entry{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 16px;margin:12px 0}
.entry .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.entry .badge{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:1.02rem}
.entry .title{font-weight:600}
.entry .form{font-family:var(--mono);font-size:.88rem;color:var(--muted);margin:2px 0 6px;overflow-wrap:anywhere}
.entry .chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.entry .chips span{font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.entry p{margin:6px 0}
.entry .n{color:var(--muted);font-size:.92rem}
.entry .ex{margin:8px 0 2px}
.msg td:first-child{font-family:var(--mono);font-weight:700;white-space:nowrap;color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.hidden{display:none !important}
.back-top{position:fixed;right:18px;bottom:18px;z-index:4}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{position:fixed;top:0;left:0;z-index:10;width:min(86vw,320px);height:100vh;background:var(--panel);transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25);padding-top:20px}
  body.toc-open nav.toc{transform:none}
  .menu-btn{display:inline-flex;position:fixed;left:16px;bottom:18px;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.2);background:var(--panel)}
  html{scroll-padding-top:12px}
  main{padding:16px 16px 80px}
  .top{padding:8px 16px;position:static}
  .search{flex:1 1 100%;order:9}
  h2{font-size:1.4rem}
  .part-title{font-size:1.6rem}
}
@media print{
  .top,nav.toc,.back-top,.ex .bar{display:none}
  .layout{display:block}
  main{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn menu-btn" id="menuBtn" type="button" aria-controls="toc" aria-expanded="false">☰ <span id="menuLabel"></span></button>
  <h1>📘 MUCPlayground <small id="docTitle">Manual</small></h1>
  <span class="spacer"></span>
  <input class="search" id="search" type="search" autocomplete="off">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button>
  </div>
  <a class="btn primary" id="openApp" href="../">▶ MUCPlayground</a>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <main><div class="doc" id="doc" aria-live="off"><p>…</p></div></main>
</div>
<a class="btn back-top" href="#top" id="backTop" hidden>↑</a>
<script type="module" src="manual-page.js"></script>
</body>
</html>
